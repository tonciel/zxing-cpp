# Wheels of this fork's python-try-denoise patch for the Monday project, until upstream releases
# try_denoise (zxing-cpp issue #1170). CPython 3.12+ stable-ABI wheels for Linux amd64 and arm64,
# built natively on each architecture and attached to a release named after the tag.
name: monday-wheels

on:
  push:
    tags: ["monday-*"]
  workflow_dispatch:

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install cibuildwheel
      run: python3 -m pip install cibuildwheel==3.3.0

    - name: Build wheels
      env:
        CIBW_BUILD: "cp312-manylinux_*"
      run: python3 -m cibuildwheel --output-dir wheelhouse wrappers/python

    - uses: actions/upload-artifact@v6
      with:
        name: wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl

  release:
    needs: build-wheels
    if: startsWith(github.ref, 'refs/tags/monday-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: Checksums
      run: cd dist && sha256sum *.whl | tee SHA256SUMS

    - name: Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/SHA256SUMS --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes "zxing-cpp master 2c3dcfe + python try_denoise (#1170), CPython 3.12+ abi3, Linux amd64 and arm64."
